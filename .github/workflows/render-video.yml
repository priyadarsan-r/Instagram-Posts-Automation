name: n8n Video Renderer

# Listens for a POST request from your n8n workflow
on:
  repository_dispatch:
    types: [render_reel]

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System & Media Dependencies
        # FFmpeg handles video, edge-tts handles audio, jq parses JSON, fonts-dejavu for subtitles
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu
          pip install edge-tts

      - name: Install Playwright
        # Playwright and its browser dependencies for screen recording
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Extract n8n Payload
        # Grabs the data sent from your n8n HTTP Request node
        env:
          SCRIPT: ${{ github.event.client_payload.script }}
          REPO_URL: ${{ github.event.client_payload.repo_url }}
          N8N_WEBHOOK: ${{ github.event.client_payload.webhook_url }}
        run: |
          echo "$SCRIPT" > script.txt
          echo "$REPO_URL" > repo.txt
          echo "$N8N_WEBHOOK" > webhook.txt

      - name: Synthesize Voiceover & Subtitles
        # Generates the MP3 audio AND a matching WebVTT subtitle file
        run: |
          edge-tts --voice "en-US-ChristopherNeural" --text "$(cat script.txt)" --write-media audio.mp3 --write-subtitles subtitles.vtt

      - name: Generate Playwright Script
        # Creates the scrolling script dynamically so you don't need a separate repo file
        run: |
          cat << 'EOF' > record-scroll.js
          const { chromium } = require('playwright');
          (async () => {
            const targetUrl = process.argv[2] || 'https://github.com';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1080, height: 1920 }, // 9:16 vertical video
              recordVideo: { dir: './', size: { width: 1080, height: 1920 } }
            });
            const page = await context.newPage();
            await page.goto(targetUrl, { waitUntil: 'networkidle' });
            
            await page.evaluate(async () => {
              await new Promise((resolve) => {
                let totalHeight = 0;
                const distance = 5; 
                const timer = setInterval(() => {
                  const scrollHeight = document.body.scrollHeight;
                  window.scrollBy(0, distance);
                  totalHeight += distance;
                  // Stop after ~60 seconds or end of page
                  if (totalHeight >= scrollHeight || totalHeight >= (distance * 3000)) {
                    clearInterval(timer);
                    resolve();
                  }
                }, 20);
              });
            });
            await context.close();
            await browser.close();
          })();
          EOF

      - name: Record Scrolling Background
        run: |
          # Run the generated script with the repo URL
          node record-scroll.js "$(cat repo.txt)"
          # Playwright saves a randomly named .webm file, rename it for ffmpeg
          mv *.webm background.webm

      - name: Limit Subtitle Length (Python)
        run: |
          cat << 'EOF' > fix_subs.py
          import re
          
          with open('subtitles.vtt', 'r', encoding='utf-8') as f:
              content = f.read()
              
          blocks = re.split(r'\n\n+', content.strip())
          new_blocks = [blocks[0]] # Keep WEBVTT header
          
          for block in blocks[1:]:
              lines = block.split('\n')
              
              # Find the timestamp line safely
              time_idx = -1
              for i, line in enumerate(lines):
                  if '-->' in line:
                      time_idx = i
                      break
                      
              # If no timestamp found, keep block as is (e.g., metadata)
              if time_idx == -1:
                  new_blocks.append(block)
                  continue
                  
              times = lines[time_idx]
              text = " ".join(lines[time_idx+1:]).replace('\n', ' ')
              words = text.split()
              
              max_words = 8 # Limit to 8 words
              
              if len(words) <= max_words:
                  new_blocks.append(block)
                  continue
                  
              t_start, t_end = times.split(' --> ')
              
              # Robust Time Parsing Helper
              def parse_t(t):
                  parts = t.strip().split(':')
                  
                  # Handle missing hours (MM:SS) vs (HH:MM:SS)
                  if len(parts) == 2:
                      h, m, s = 0, parts[0], parts[1]
                  else:
                      h, m, s = parts
                      
                  ms = "0"
                  # Safely handle missing milliseconds
                  if '.' in s:
                      s, ms = s.split('.')
                  elif ',' in s:
                      s, ms = s.split(',')
                      
                  return int(h)*3600000 + int(m)*60000 + int(s)*1000 + int(ms)
                  
              def format_t(ms):
                  ms = int(ms) # <-- FIX: Force the float back to an integer
                  h = ms // 3600000
                  ms %= 3600000
                  m = ms // 60000
                  ms %= 60000
                  s = ms // 1000
                  ms %= 1000
                  return f"{h:02d}:{m:02d}:{s:02d}.{ms:03d}"
                  
              start_ms = parse_t(t_start)
              end_ms = parse_t(t_end)
              duration = end_ms - start_ms
              time_per_word = duration / max(len(words), 1)
              
              curr_start = start_ms
              for i in range(0, len(words), max_words):
                  chunk_words = words[i:i+max_words]
                  chunk_text = " ".join(chunk_words)
                  chunk_duration = time_per_word * len(chunk_words)
                  curr_end = curr_start + chunk_duration
                  
                  new_blocks.append(f"{format_t(curr_start)} --> {format_t(curr_end)}\n{chunk_text}")
                  curr_start = curr_end
                  
          with open('subtitles_fixed.vtt', 'w', encoding='utf-8') as f:
              f.write("\n\n".join(new_blocks))
          EOF
          python fix_subs.py

      - name: Render Video with Subtitles (FFmpeg)
        # 1. FontSize=14 reduces the text size as requested
        # 2. BorderStyle=3 converts the text outline into a solid background box
        # 3. BackColour=&H00000000 sets the box to solid black
        # 4. Outline=6 adds padding inside the black box so text doesn't touch the edges
        # 5. MarginL=80 and MarginR=80 squeeze the text width to force 2-line wrapping
        run: |
          ffmpeg -stream_loop -1 -i background.webm -i audio.mp3 -vf \
          "format=yuv420p,subtitles=subtitles_fixed.vtt:force_style='Fontname=DejaVu Sans,FontSize=12,Alignment=2,MarginV=40,MarginL=80,MarginR=80,PrimaryColour=&H00FFFFFF,BackColour=&H00000000,BorderStyle=3,Outline=6,Shadow=0'" \
          -c:v libx264 -c:a aac -shortest -y output.mp4

      - name: Upload for Meta & Get Raw URL
        id: upload
        # Uploads to tmpfiles.org for a free, temporary direct download link
        run: |
          UPLOAD_RES=$(curl -s -F "file=@output.mp4" https://tmpfiles.org/api/v1/upload)
          PAGE_URL=$(echo $UPLOAD_RES | jq -r '.data.url')
          DIRECT_URL="${PAGE_URL/tmpfiles.org\//tmpfiles.org/dl/}"
          
          echo "Video temporarily hosted at: $DIRECT_URL"
          echo "url=$DIRECT_URL" >> $GITHUB_OUTPUT

      - name: Ping n8n Webhook
        # Sends the direct video URL back to the waiting n8n node
        env:
          VIDEO_URL: ${{ steps.upload.outputs.url }}
        run: |
          N8N_URL=$(cat webhook.txt)
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"video_url\": \"$VIDEO_URL\", \"status\": \"success\"}" \
            $N8N_URL
